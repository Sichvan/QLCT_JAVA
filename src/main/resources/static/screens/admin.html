<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - QLCT_HK</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="dashboard-layout">
    <main class="main-content" style="margin-left:0;">
      <header class="topbar" style="background:#FF8300; color:white;">
        <span style="font-size:1.4rem; font-weight:700;">Admin Dashboard</span>
        <i class="material-icons" onclick="logoutAdmin()" style="cursor:pointer; font-size:28px;">logout</i>
      </header>

      <div class="content-area">
        <div style="display:flex; gap:20px; margin-bottom:32px;">
          <div class="card text-center" style="flex:1; background:#e3f2fd; border:2px solid #2196f3;">
            <i class="material-icons" style="font-size:48px; color:#2196f3;">people</i>
            <h2 id="admin-total-users" style="color:#2196f3; font-size:2.5rem; margin:12px 0;">0</h2>
            <p>Tổng số người dùng</p>
          </div>
          <div class="card text-center" style="flex:1; background:#e8f5e9; border:2px solid #4caf50;">
            <i class="material-icons" style="font-size:48px; color:#4caf50;">person_add</i>
            <h2 id="admin-new-users" style="color:#4caf50; font-size:2.5rem; margin:12px 0;">0</h2>
            <p>Mới trong 3 ngày</p>
          </div>
        </div>

        <h3 style="margin-bottom:16px;">Danh sách người dùng</h3>
        <div id="admin-user-list"></div>
      </div>
    </main>
  </div>
  <script src="/js/admin.js"></script>
<script src="/js/i18n.js"></script>
</body>
</html>
