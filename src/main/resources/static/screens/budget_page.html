<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân sách - ExpensePro</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <style>
        .progress-bar { width: 100%; height: 10px; background: var(--border-color); border-radius: 8px; margin: 16px 0 12px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success-color); border-radius: 8px; transition: 0.4s ease; }
        .progress-fill.warning { background: var(--warning-color); }
        .progress-fill.danger { background: var(--danger-color); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; background: var(--bg-color); color: var(--text-main);}
        .form-control:focus { border-color: var(--primary-color); background: var(--card-bg); }
        .modal-actions { display: flex; gap: 12px; margin-top: 32px; }
        .btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #f1f5f9; color: #1f2937; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-submit { flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--primary-color); color: white; font-weight: 600; cursor: pointer; transition: 0.2s;}

        /* CSS CHO THÔNG BÁO NỔI (TOAST NOTIFICATION) */
        .toast-notification {
            position: fixed;
            bottom: 90px; /* Cách đáy một khoảng để không đè lên thanh nav ở Mobile */
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Hiệu ứng nảy nhẹ (bounce) */
            z-index: 9999;
            pointer-events: none;
        }
        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @media (min-width: 769px) {
            .toast-notification {
                bottom: 40px; 
                left: calc(50% + 130px); /* Canh giữa phần content (bù cho sidebar) */
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="material-icons">account_balance_wallet</i> ExpensePro</div>
            <nav class="sidebar-menu">
                <a href="/screens/home.html" class="menu-item"><i class="material-icons">dashboard</i> Tổng quan</a>
                <a href="/screens/wallet.html" class="menu-item"><i class="material-icons">account_balance</i> Ví của tôi</a>
                <a href="/screens/stats.html" class="menu-item"><i class="material-icons">pie_chart</i> Thống kê</a>
            </nav>
            <div class="sidebar-footer"><a href="/screens/settings.html" class="menu-item"><i class="material-icons">settings</i> Cài đặt</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div onclick="window.location.href='/screens/wallet.html'" style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--border-color)'; this.style.color='var(--text-main)'">
                        <i class="material-icons">arrow_back</i>
                    </div>
                    <h1 class="page-title">Ngân sách</h1>
                </div>
            </header>

            <div class="content-area" style="max-width: 800px;">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 20px; font-weight: 600;">Ngân sách tháng này</h2>
                    <button class="btn-primary" onclick="openModal()"><i class="material-icons">add</i> Thêm mới</button>
                </div>
                <div id="budget-list"><p class="text-center" style="color: var(--text-muted);">Đang tải dữ liệu...</p></div>
            </div>
        </main>
    </div>

    <div id="toast-notification" class="toast-notification">
        <i class="material-icons" style="font-size: 20px;">error_outline</i>
        <span>Cảnh báo: Bạn đã chi tiêu vượt quá một số ngân sách!</span>
    </div>

    <div class="modal-overlay" id="budgetModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 24px; font-size: 20px;">Thiết lập ngân sách</h2>
            <div class="form-group">
                <label>Danh mục</label>
                <select id="budget-cat" class="form-control" style="background-image: none;">
                    <option value="eating">Ăn uống</option>
                    <option value="shopping">Mua sắm</option>
                    <option value="transport">Di chuyển</option>
                    <option value="education">Học tập</option>
                    <option value="health">Sức khỏe</option>
                    <option value="other_expense">Chi tiêu khác</option>
                </select>
            </div>
            <div class="form-group">
                <label>Số tiền hạn mức (VNĐ)</label>
                <input type="tel" id="budget-limit" class="form-control" placeholder="VD: 5.000.000" style="font-size: 20px; font-weight: bold; color: var(--primary-color);" onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">HỦY</button>
                <button class="btn-submit" onclick="submitBudget()">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/index.html';

        // Fix lỗi gõ tiếng việt/Unikey
        function unformatCurrency(input) { if (input.value) input.value = input.value.replace(/\./g, ''); }
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            if (val) input.value = parseInt(val, 10).toLocaleString('vi-VN');
            else input.value = '';
        }
        function getRawNumber(formattedStr) {
            if (!formattedStr) return 0;
            return parseInt(formattedStr.toString().replace(/\D/g, ''), 10) || 0;
        }

        const formatCurrencyText = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        // HÀM HIỂN THỊ THÔNG BÁO NỔI
        function showToastWarning() {
            const toast = document.getElementById('toast-notification');
            if(!toast) return;
            // Hiện thông báo
            toast.classList.add('show');
            // Tự động tắt sau 3.5 giây
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        async function fetchBudgets() {
            try {
                const response = await fetch('/api/budgets', { headers: { 'Authorization': `Bearer ${token}` } });
                const budgets = await response.json();
                const listDiv = document.getElementById('budget-list');
                
                if (budgets.length === 0) {
                    listDiv.innerHTML = `<div class="text-center" style="color: grey; margin-top: 40px;"><i class="material-icons" style="font-size: 64px; opacity: 0.5;">account_balance_wallet</i><p style="margin-top: 10px;">Chưa có ngân sách nào được thiết lập</p></div>`;
                    return;
                }

                let hasExceededBudget = false; // Biến kiểm tra xem có vượt không

                listDiv.innerHTML = budgets.map(budget => {
                    let percent = (budget.spentAmount / budget.limitAmount) * 100;
                    if (percent > 100) percent = 100;
                    
                    // Tính toán vượt ngân sách
                    let isOver = budget.spentAmount > budget.limitAmount;
                    if (isOver) hasExceededBudget = true; // Phát hiện có ngân sách bị vượt
                    
                    let colorClass = '';
                    if (percent > 75 && percent <= 100) colorClass = 'warning';
                    if (isOver) colorClass = 'danger';

                    return `
                        <div class="card">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="bold" style="font-size: 16px;">${budget.categoryName || budget.category}</span>
                                <i class="material-icons" style="color: var(--danger-color); cursor: pointer; font-size: 20px;" onclick="deleteBudget('${budget.id}')">delete</i>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${colorClass}" style="width: ${percent}%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span style="color: ${isOver ? 'var(--danger-color)' : 'var(--success-color)'}; font-weight: bold;">Đã chi: ${formatCurrencyText(budget.spentAmount)}</span>
                                <span class="bold">Hạn mức: ${formatCurrencyText(budget.limitAmount)}</span>
                            </div>
                            ${isOver ? '<div style="background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 8px; margin-top: 12px; color: var(--danger-color); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><i class="material-icons" style="font-size: 16px;">warning</i> Đã vượt ngân sách tháng này!</div>' : ''}
                        </div>
                    `;
                }).join('');

                // GỌI THÔNG BÁO NỔI NẾU CÓ VƯỢT NGÂN SÁCH
                if (hasExceededBudget) {
                    showToastWarning();
                }

            } catch (err) { console.error('Lỗi tải ngân sách:', err); }
        }

        async function deleteBudget(id) {
            if (confirm("Bạn có chắc muốn xóa ngân sách này?")) {
                await fetch(`/api/budgets/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                fetchBudgets(); 
            }
        }

        function openModal() { document.getElementById('budgetModal').classList.add('active'); }
        function closeModal() { document.getElementById('budgetModal').classList.remove('active'); document.getElementById('budget-limit').value = ''; }
        
        async function submitBudget() {
            const catSelect = document.getElementById('budget-cat');
            const cat = catSelect.value;
            const catName = catSelect.options[catSelect.selectedIndex].text;
            const limitStr = document.getElementById('budget-limit').value;
            const limit = getRawNumber(limitStr);
            
            if (limit <= 0) return alert("Số tiền không hợp lệ!");
            
            try {
                await fetch('/api/budgets', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: cat, categoryName: catName, limitAmount: limit })
                });
                closeModal();
                fetchBudgets(); // Render lại danh sách
            } catch (e) { alert("Lỗi kết nối!"); }
        }

        // Tự động tải dữ liệu khi vừa vào trang
        fetchBudgets();
    </script>
</body>
</html>
