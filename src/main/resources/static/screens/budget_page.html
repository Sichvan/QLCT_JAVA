<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân sách - QLCT_HK</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <style>
        .progress-bar { width: 100%; height: 10px; background: var(--border-color); border-radius: 8px; margin: 16px 0 12px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success-color); border-radius: 8px; transition: 0.4s ease; }
        .progress-fill.warning { background: var(--warning-color); }
        .progress-fill.danger { background: var(--danger-color); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; background: var(--bg-color); color: var(--text-main);}
        .form-control:focus { border-color: var(--primary-color); background: var(--card-bg); }
        .modal-actions { display: flex; gap: 12px; margin-top: 32px; }
        .btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #f1f5f9; color: #1f2937; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-submit { flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--primary-color); color: white; font-weight: 600; cursor: pointer; transition: 0.2s;}

        .toast-notification { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 12px 24px; border-radius: 50px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); font-weight: 600; font-size: 14px; opacity: 0; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 9999; pointer-events: none; }
        .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @media (min-width: 769px) { .toast-notification { bottom: 40px; left: calc(50% + 130px); } }
    </style>
<script src="/js/i18n.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside id="sidebar-container" class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div onclick="window.location.href='/screens/wallet.html'" style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--border-color)'; this.style.color='var(--text-main)'"><i class="material-icons">arrow_back</i></div>
                    <h1 class="page-title" data-i18n="budget.title">Ngân sách</h1>
                </div>
            </header>

            <div class="content-area" style="max-width: 800px;">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 20px; font-weight: 600;" data-i18n="budget.month_budget">Ngân sách tháng này</h2>
                    <button class="btn-primary" onclick="openModal()"><i class="material-icons">add</i> <span data-i18n="budget.btn_add">Thêm mới</span></button>
                </div>
                <div id="budget-list"><p class="text-center" style="color: var(--text-muted);" data-i18n="budget.loading">Đang tải dữ liệu...</p></div>
            </div>
        </main>
    </div>

    <div id="toast-notification" class="toast-notification">
        <i class="material-icons" style="font-size: 20px;">error_outline</i>
        <span data-i18n="budget.warning_toast">Cảnh báo: Bạn đã chi tiêu vượt quá một số ngân sách!</span>
    </div>

    <div class="modal-overlay" id="budgetModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 24px; font-size: 20px;" data-i18n="budget.modal_title">Thiết lập ngân sách</h2>
            <div class="form-group">
                <label data-i18n="budget.cat">Danh mục</label>
                <select id="budget-cat" class="form-control" style="background-image: none;">
                    <option value="eating" data-i18n="cat.eating">Ăn uống</option>
                    <option value="shopping" data-i18n="cat.shopping">Mua sắm</option>
                    <option value="transport" data-i18n="cat.transport">Di chuyển</option>
                    <option value="education" data-i18n="cat.education">Học tập</option>
                    <option value="health" data-i18n="cat.health">Sức khỏe</option>
                    <option value="other_expense" data-i18n="cat.other_expense">Chi tiêu khác</option>
                </select>
            </div>
            <div class="form-group">
                <label data-i18n="budget.amount">Số tiền hạn mức (VNĐ)</label>
                <input type="tel" id="budget-limit" class="form-control" data-i18n="budget.amount_placeholder" placeholder="VD: 5.000.000" style="font-size: 20px; font-weight: bold; color: var(--primary-color);" onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()" data-i18n="budget.btn_cancel">HỦY</button>
                <button class="btn-submit" onclick="submitBudget()" data-i18n="budget.btn_save">LƯU LẠI</button>
            </div>
        </div>
    </div>

    <script>
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/index.html';

        function unformatCurrency(input) { if (input.value) input.value = input.value.replace(/\./g, ''); }
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            if (val) input.value = parseInt(val, 10).toLocaleString('vi-VN');
            else input.value = '';
        }
        function getRawNumber(formattedStr) {
            if (!formattedStr) return 0;
            return parseInt(formattedStr.toString().replace(/\D/g, ''), 10) || 0;
        }
        const formatCurrencyText = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        function showToastWarning() {
            const toast = document.getElementById('toast-notification');
            if(!toast) return;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        async function fetchBudgets() {
            try {
                const response = await fetch('/api/budgets', { headers: { 'Authorization': `Bearer ${token}` } });
                const budgets = await response.json();
                const listDiv = document.getElementById('budget-list');
                
                if (budgets.length === 0) {
                    listDiv.innerHTML = `<div class="text-center" style="color: grey; margin-top: 40px;"><i class="material-icons" style="font-size: 64px; opacity: 0.5;">account_balance_wallet</i><p style="margin-top: 10px;">${t('budget.no_budget')}</p></div>`;
                    return;
                }

                let hasExceededBudget = false;

                listDiv.innerHTML = budgets.map(budget => {
                    let percent = (budget.spentAmount / budget.limitAmount) * 100;
                    if (percent > 100) percent = 100;
                    
                    let isOver = budget.spentAmount > budget.limitAmount;
                    if (isOver) hasExceededBudget = true; 
                    
                    let colorClass = '';
                    if (percent > 75 && percent <= 100) colorClass = 'warning';
                    if (isOver) colorClass = 'danger';

                    return `
                        <div class="card">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="bold" style="font-size: 16px;">${tCat(budget.category, budget.categoryName)}</span>
                                <div style="display: flex; gap: 12px; align-items: center;">
                                    <i class="material-icons" style="color: var(--primary-color); cursor: pointer; font-size: 20px;" onclick="editBudget('${budget.category}', ${budget.limitAmount})">edit</i>
                                    <i class="material-icons" style="color: var(--danger-color); cursor: pointer; font-size: 20px;" onclick="deleteBudget('${budget.id}')">delete</i>
                                </div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${colorClass}" style="width: ${percent}%;"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span style="color: ${isOver ? 'var(--danger-color)' : 'var(--success-color)'}; font-weight: bold;">${t('budget.spent')}: ${formatCurrencyText(budget.spentAmount)}</span>
                                <span class="bold">${t('budget.limit')}: ${formatCurrencyText(budget.limitAmount)}</span>
                            </div>
                            ${isOver ? `<div style="background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 8px; margin-top: 12px; color: var(--danger-color); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;"><i class="material-icons" style="font-size: 16px;">warning</i> ${t('budget.exceeded')}</div>` : ''}
                        </div>
                    `;
                }).join('');

                if (hasExceededBudget) showToastWarning();

            } catch (err) { console.error('Lỗi tải ngân sách:', err); }
        }

        async function deleteBudget(id) {
            if (confirm(t('budget.confirm_delete'))) {
                await fetch(`/api/budgets/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                fetchBudgets(); 
            }
        }

        function openModal() { document.getElementById('budgetModal').classList.add('active'); }
        
        // HÀM SỬA NGÂN SÁCH
        function editBudget(cat, limit) {
            document.getElementById('budget-cat').value = cat;
            document.getElementById('budget-cat').disabled = true; // Khóa danh mục
            document.getElementById('budget-limit').value = limit.toLocaleString('vi-VN');
            document.getElementById('budgetModal').classList.add('active');
        }

        function closeModal() { 
            document.getElementById('budgetModal').classList.remove('active'); 
            document.getElementById('budget-limit').value = ''; 
            document.getElementById('budget-cat').disabled = false; // Mở khóa
        }
        
        async function submitBudget() {
            const catSelect = document.getElementById('budget-cat');
            const cat = catSelect.value;
            const catName = catSelect.options[catSelect.selectedIndex].text;
            const limit = getRawNumber(document.getElementById('budget-limit').value);
            
            if (limit <= 0) return alert(t('tx.error_amount'));
            
            try {
                await fetch('/api/budgets', {
                    method: 'POST', // Backend tự biết update nếu trùng category
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category: cat, categoryName: catName, limitAmount: limit })
                });
                closeModal();
                fetchBudgets(); 
            } catch (e) { alert(t('cat_manage.server_error')); }
        }

        fetchBudgets();
    </script>
<script src="/js/sidebar.js"></script>
</body>
</html>
