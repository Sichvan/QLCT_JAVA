<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Giao Dịch - QLCT_HK</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <style>
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; background: var(--bg-color); color: var(--text-main);}
        .form-control:focus { border-color: var(--primary-color); background: var(--card-bg); }
        
        .custom-tab-bar { display: flex; background: var(--border-color); border-radius: 14px; padding: 6px; margin-bottom: 24px;}
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; color: var(--text-main); cursor: pointer; border-radius: 10px; transition: 0.2s;}
        .tab-btn.active { background: var(--primary-color); color: white; box-shadow: var(--shadow-sm);}
        
        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; max-height: 220px; overflow-y: auto; padding: 4px; }
        .category-grid::-webkit-scrollbar { width: 4px; }
        .category-grid::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        
        .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border-radius: 16px; border: 2px solid transparent; cursor: pointer; transition: 0.2s; background: var(--bg-color); }
        .cat-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); background: var(--card-bg); }
        .cat-item.selected { border-color: var(--primary-color); background: rgba(67, 97, 238, 0.08); }
        .cat-icon-box { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .cat-icon-box img { width: 100%; height: 100%; object-fit: contain; }
        .cat-name { font-size: 12px; font-weight: 500; text-align: center; color: var(--text-main); line-height: 1.2; }
    </style>
<script src="/js/i18n.js"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside id="sidebar-container" class="sidebar"></aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div onclick="history.back()" style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--border-color)'; this.style.color='var(--text-main)'">
                        <i class="material-icons">arrow_back</i>
                    </div>
                    <h1 class="page-title" data-i18n="tx.title">Thêm Giao Dịch</h1>
                </div>
            </header>

            <div class="content-area" style="max-width: 600px;">
                <div class="custom-tab-bar">
                    <div class="tab-btn active" onclick="switchTab('expense')" id="tab-expense" data-i18n="tx.expense">Chi Tiêu</div>
                    <div class="tab-btn" onclick="switchTab('income')" id="tab-income" data-i18n="tx.income">Thu Nhập</div>
                    <div class="tab-btn" onclick="switchTab('loan')" id="tab-loan" data-i18n="tx.loan">Vay / Nợ</div>
                </div>

                <div class="card" style="padding: 32px; border-radius: 20px;">
                    
                    <div class="form-group">
                        <label data-i18n="tx.amount">Số tiền (VNĐ)</label>
                        <input type="tel" id="tx-amount" class="form-control" data-i18n="tx.amount_placeholder" placeholder="VD: 500.000" style="font-size: 28px; font-weight: bold; color: var(--primary-color); background: var(--card-bg);" onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label data-i18n="tx.select_cat">Chọn danh mục</label>
                        <div class="category-grid" id="category-grid">
                            <p style="color: var(--text-muted); font-size: 13px;">Đang tải danh mục...</p>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label data-i18n="tx.date">Ngày giao dịch</label>
                        <input type="date" id="tx-date" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label data-i18n="tx.note">Ghi chú</label>
                        <input type="text" id="tx-note" class="form-control" data-i18n="tx.note_placeholder" placeholder="Chi tiết giao dịch (không bắt buộc)..." autocomplete="off">
                    </div>

                    <button class="btn-primary" style="width: 100%; justify-content: center; padding: 16px; font-size: 16px; margin-top: 12px;" onclick="submitTransaction()">
                        <i class="material-icons">save</i> <span data-i18n="tx.save">LƯU GIAO DỊCH</span>
                    </button>
                    <p id="tx-msg" class="text-center" style="margin-top: 16px; font-size: 14px; color: var(--danger-color); font-weight: 500;"></p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Bật chế độ tối nếu user đã chọn
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/index.html';

        let currentType = 'expense';
        let allCategories = [];
        let selectedCategory = null;
        let selectedCategoryName = null;

        // XỬ LÝ NHẬP TIỀN CHỐNG LỖI
        function unformatCurrency(input) { if (input.value) input.value = input.value.replace(/\./g, ''); }
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            if (val) input.value = parseInt(val, 10).toLocaleString('vi-VN');
            else input.value = '';
        }
        function getRawNumber(formattedStr) {
            if (!formattedStr) return 0;
            return parseInt(formattedStr.toString().replace(/\D/g, ''), 10) || 0;
        }

        document.getElementById('tx-date').valueAsDate = new Date();

        // DANH MỤC MẶC ĐỊNH
        const defaultCategories = [
            { id: 'eating', name: 'Ăn uống', icon: 'eating', type: 'expense' },
            { id: 'shopping', name: 'Mua sắm', icon: 'shopping', type: 'expense' },
            { id: 'transport', name: 'Di chuyển', icon: 'transport', type: 'expense' },
            { id: 'education', name: 'Học tập', icon: 'education', type: 'expense' },
            { id: 'health', name: 'Sức khỏe', icon: 'health', type: 'expense' },
            { id: 'other_expense', name: 'Chi tiêu khác', icon: 'other_expense', type: 'expense' },
            
            { id: 'salary', name: 'Tiền lương', icon: 'salary', type: 'income' },
            { id: 'investment', name: 'Đầu tư', icon: 'investment', type: 'income' },
            { id: 'other_income', name: 'Thu nhập khác', icon: 'other_income', type: 'income' },
            
            { id: 'lending', name: 'Cho vay', icon: 'lending', type: 'loan' },
            { id: 'borrowing', name: 'Đi vay', icon: 'borrowing', type: 'loan' },
            { id: 'repaying', name: 'Trả nợ', icon: 'repaying', type: 'loan' },
            { id: 'collecting', name: 'Thu nợ', icon: 'collecting', type: 'loan' }
        ];

        async function loadCategories() {
            try {
                // Tải danh mục do User tự tạo từ Backend
                const res = await fetch('/api/categories', { headers: { 'Authorization': `Bearer ${token}` }});
                let userCats = [];
                if (res.ok) {
                    userCats = await res.json();
                }
                
                // Gộp danh mục mặc định và danh mục của user
                allCategories = [...defaultCategories, ...userCats];
                switchTab('expense'); 
            } catch (err) {
                console.error("Lỗi tải danh mục:", err);
                // Nếu lỗi mạng, vẫn hiển thị các danh mục mặc định
                allCategories = [...defaultCategories];
                switchTab('expense');
            }
        }

        function switchTab(type) {
            currentType = type;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');

            const grid = document.getElementById('category-grid');
            const filtered = allCategories.filter(c => c.type === type);
            
            if(filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">${t('tx.no_cat')}</p>`;
                selectedCategory = null;
                selectedCategoryName = null;
                return;
            }

            grid.innerHTML = filtered.map(c => {
                const displayName = typeof tCat === 'function' ? tCat(c.icon || c.id, c.name) : c.name;
                return `
                <div class="cat-item" data-id="${c.icon || c.id}" data-name="${displayName.replace(/'/g, "\\'")}" onclick="selectCategory('${c.icon || c.id}', '${displayName.replace(/'/g, "\\'")}', this)">
                    <div class="cat-icon-box"><img src="/assets/icons/${c.icon || c.id}.png" onerror="this.src='/assets/icons/other_expense.png'"></div>
                    <div class="cat-name">${displayName}</div>
                </div>
            `}).join('');
            
            // Tự động chọn danh mục đầu tiên cho nhanh
            const firstItem = grid.querySelector('.cat-item');
            if (firstItem) firstItem.click();
        }

        function selectCategory(id, name, element) {
            selectedCategory = id;
            selectedCategoryName = name;
            
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        async function submitTransaction() {
            const amountStr = document.getElementById('tx-amount').value;
            const amount = getRawNumber(amountStr);
            const date = document.getElementById('tx-date').value;
            const note = document.getElementById('tx-note').value;
            const msgBox = document.getElementById('tx-msg');

            msgBox.textContent = ''; 

            if (amount <= 0) return msgBox.textContent = t('tx.error_amount');
            if (!selectedCategory) return msgBox.textContent = t('tx.error_cat');

            const payload = {
                type: currentType,
                amount: amount,
                category: selectedCategory, 
                categoryName: selectedCategoryName,
                date: new Date(date).toISOString(),
                note: note
            };

            try {
                const response = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.href = '/screens/home.html';
                } else {
                    const data = await response.json();
                    msgBox.textContent = data.message || t('tx.error_general');
                }
            } catch (error) {
                msgBox.textContent = t('tx.error_server');
            }
        }

        loadCategories();
    </script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
