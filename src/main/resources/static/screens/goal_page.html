<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu - ExpensePro</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <style>
        .progress-bar { width: 100%; height: 10px; background: var(--border-color); border-radius: 8px; margin: 16px 0 12px 0; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 8px; transition: 0.4s ease; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; background: var(--bg-color); color: var(--text-main);}
        .form-control:focus { border-color: var(--primary-color); background: var(--card-bg); }
        .modal-actions { display: flex; gap: 12px; margin-top: 32px; }
        .btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #f1f5f9; color: #1f2937; font-weight: 600; cursor: pointer; transition: 0.2s;}
        .btn-submit { flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--primary-color); color: white; font-weight: 600; cursor: pointer; transition: 0.2s;}
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="material-icons">account_balance_wallet</i> ExpensePro</div>
            <nav class="sidebar-menu">
                <a href="/screens/home.html" class="menu-item"><i class="material-icons">dashboard</i> Tổng quan</a>
                <a href="/screens/wallet.html" class="menu-item"><i class="material-icons">account_balance</i> Ví của tôi</a>
                <a href="/screens/stats.html" class="menu-item"><i class="material-icons">pie_chart</i> Thống kê</a>
            </nav>
            <div class="sidebar-footer"><a href="/screens/settings.html" class="menu-item"><i class="material-icons">settings</i> Cài đặt</a></div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div onclick="window.location.href='/screens/wallet.html'" style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--border-color)'; this.style.color='var(--text-main)'">
                        <i class="material-icons">arrow_back</i>
                    </div>
                    <h1 class="page-title">Mục tiêu tiết kiệm</h1>
                </div>
            </header>

            <div class="content-area" style="max-width: 800px;">
                <div class="flex-between" style="margin-bottom: 24px;">
                    <h2 style="font-size: 20px; font-weight: 600;">Danh sách mục tiêu</h2>
                    <button class="btn-primary" onclick="openAddModal()"><i class="material-icons">add</i> Thêm mới</button>
                </div>
                <div id="goal-list"><p class="text-center" style="color: var(--text-muted);">Đang tải dữ liệu...</p></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="addGoalModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 24px; font-size: 20px;">Thêm mục tiêu mới</h2>
            <div class="form-group">
                <label>Tên mục tiêu</label>
                <input type="text" id="goal-name" class="form-control" placeholder="VD: Mua xe máy, Du lịch...">
            </div>
            <div class="form-group">
                <label>Số tiền cần đạt (VNĐ)</label>
                <input type="tel" id="goal-target" class="form-control" placeholder="VD: 50.000.000" style="font-size: 20px; font-weight: bold; color: var(--primary-color);" onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddModal()">HỦY</button>
                <button class="btn-submit" onclick="submitGoal()">TẠO MỤC TIÊU</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="depositModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px; font-size: 20px;">Nạp tiền tiết kiệm</h2>
            <p id="deposit-goal-name" style="color: var(--text-main); font-weight: 600; margin-bottom: 4px;"></p>
            <p id="deposit-goal-remaining-text" style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;"></p>
            
            <input type="hidden" id="deposit-goal-id">
            <input type="hidden" id="deposit-goal-remaining"> <div class="form-group">
                <label>Số tiền nạp (VNĐ)</label>
                <input type="tel" id="deposit-amount" class="form-control" placeholder="VD: 500.000" style="font-size: 24px; font-weight: bold; color: var(--success-color);" onfocus="unformatCurrency(this)" onblur="formatCurrency(this)" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeDepositModal()">HỦY</button>
                <button class="btn-submit" style="background: var(--success-color);" onclick="submitDeposit()">NẠP VÀO</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/index.html';

        function setupCurrencyInput(inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            let isComposing = false;
            input.addEventListener('compositionstart', () => { isComposing = true; });
            input.addEventListener('compositionend', () => { isComposing = false; formatInput(input); });
            input.addEventListener('input', () => { if (!isComposing) formatInput(input); });
            function formatInput(el) {
                let cursorPosition = el.selectionStart;
                let originalLength = el.value.length;
                let val = el.value.replace(/\D/g, ''); 
                if (val !== '') {
                    el.value = parseInt(val, 10).toLocaleString('vi-VN');
                    let newLength = el.value.length;
                    cursorPosition = cursorPosition + (newLength - originalLength);
                    el.setSelectionRange(cursorPosition, cursorPosition);
                } else { el.value = ''; }
            }
        }

        // Chống lỗi gõ tiếng Việt / Unikey
        function unformatCurrency(input) { if (input.value) input.value = input.value.replace(/\./g, ''); }
        function formatCurrency(input) {
            let val = input.value.replace(/\D/g, '');
            if (val) input.value = parseInt(val, 10).toLocaleString('vi-VN');
            else input.value = '';
        }
        function getRawNumber(formattedStr) {
            if (!formattedStr) return 0;
            return parseInt(formattedStr.toString().replace(/\D/g, ''), 10) || 0;
        }

        setupCurrencyInput('goal-target');
        setupCurrencyInput('deposit-amount');

        const formatCurrencyText = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        async function fetchGoals() {
            try {
                const response = await fetch('/api/goals', { headers: { 'Authorization': `Bearer ${token}` } });
                const goals = await response.json();
                const listDiv = document.getElementById('goal-list');
                
                if (goals.length === 0) {
                    listDiv.innerHTML = `<div class="text-center" style="color: grey; margin-top: 40px;"><i class="material-icons" style="font-size: 64px; opacity: 0.5;">flag</i><p style="margin-top: 10px;">Chưa có mục tiêu nào</p></div>`;
                    return;
                }

                listDiv.innerHTML = goals.map(goal => {
                    let percent = (goal.currentAmount / goal.targetAmount) * 100;
                    if (percent > 100) percent = 100;
                    
                    const safeName = goal.name.replace(/'/g, "\\'");

                    return `
                        <div class="card" style="cursor: pointer; transition: 0.2s;" onclick="openDepositModal('${goal.id}', '${safeName}', ${goal.currentAmount}, ${goal.targetAmount})">
                            <div style="display: flex; align-items: center;">
                                <div style="background: rgba(67, 97, 238, 0.1); padding: 12px; border-radius: 50%; margin-right: 16px; display: flex; justify-content: center; align-items: center;">
                                    <i class="material-icons" style="color: var(--primary-color);">savings</i>
                                </div>
                                <div style="flex: 1;">
                                    <div class="bold" style="font-size: 16px;">${goal.name}</div>
                                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Nhấn vào để nạp tiền</div>
                                </div>
                                <i class="material-icons" style="color: var(--danger-color); padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 8px;" onclick="event.stopPropagation(); deleteGoal('${goal.id}')">delete</i>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percent}%; background: var(--primary-color);"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 13px;">
                                <span class="bold" style="color: var(--primary-color);">${formatCurrencyText(goal.currentAmount)}</span>
                                <span style="color: var(--text-muted); font-weight: 500;">Mục tiêu: ${formatCurrencyText(goal.targetAmount)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) { console.error(err); }
        }

        async function deleteGoal(id) {
            if (confirm("Bạn có chắc muốn xóa mục tiêu này? (Nếu mục tiêu chưa đầy, số tiền sẽ được hoàn lại vào ví)")) {
                const res = await fetch(`/api/goals/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                alert(data.message);
                fetchGoals();
            }
        }

        function openAddModal() { document.getElementById('addGoalModal').classList.add('active'); }
        function closeAddModal() { document.getElementById('addGoalModal').classList.remove('active'); document.getElementById('goal-name').value=''; document.getElementById('goal-target').value=''; }
        
        async function submitGoal() {
            const name = document.getElementById('goal-name').value;
            const target = getRawNumber(document.getElementById('goal-target').value);
            if (!name) return alert("Vui lòng nhập tên mục tiêu!");
            if (target <= 0) return alert("Số tiền không hợp lệ!");

            await fetch('/api/goals', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, targetAmount: target })
            });
            closeAddModal();
            fetchGoals();
        }

        // TRUYỀN THÊM TIỀN HIỆN TẠI VÀ TIỀN MỤC TIÊU VÀO MODAL
        function openDepositModal(id, name, currentAmount, targetAmount) {
            const remaining = targetAmount - currentAmount;
            
            document.getElementById('deposit-goal-id').value = id;
            document.getElementById('deposit-goal-remaining').value = remaining;
            
            document.getElementById('deposit-goal-name').textContent = "Mục tiêu: " + name;
            document.getElementById('deposit-goal-remaining-text').textContent = "Số tiền còn thiếu: " + formatCurrencyText(remaining);
            
            document.getElementById('depositModal').classList.add('active');
        }

        function closeDepositModal() { 
            document.getElementById('depositModal').classList.remove('active'); 
            document.getElementById('deposit-amount').value = ''; 
        }

        async function submitDeposit() {
            const id = document.getElementById('deposit-goal-id').value;
            let amount = getRawNumber(document.getElementById('deposit-amount').value);
            const remaining = parseFloat(document.getElementById('deposit-goal-remaining').value);

            if (amount <= 0) return alert("Số tiền nạp không hợp lệ!");

            // XỬ LÝ LOGIC NẾU NHẬP LỐ TIỀN THÌ CHỈ LẤY PHẦN CÒN THIẾU
            if (amount > remaining) {
                alert(`Bạn nhập dư tiền!\nHệ thống sẽ chỉ trích đúng ${formatCurrencyText(remaining)} để hoàn thành mục tiêu này.`);
                amount = remaining; // Cắt giảm số tiền bằng với số còn thiếu
            }

            try {
                const res = await fetch(`/api/goals/${id}/deposit`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });
                
                const data = await res.json();
                if (res.ok) {
                    closeDepositModal();
                    if (data.isSuccess) {
                        alert("🎉 CHÚC MỪNG BẠN! 🎉\nBạn đã tiết kiệm đủ tiền. Mục tiêu này đã hoàn thành và sẽ được gỡ khỏi danh sách.");
                        await fetch(`/api/goals/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                    } else {
                        alert("Nạp tiền thành công!");
                    }
                    fetchGoals();
                } else {
                    alert(data.message || "Lỗi nạp tiền! (Ví của bạn có đủ tiền không?)");
                }
            } catch (err) { console.error(err); }
        }

        fetchGoals();
    </script>
</body>
</html>
