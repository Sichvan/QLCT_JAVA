<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Danh mục</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;}
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 15px; background: var(--bg-color); color: var(--text-main); transition: 0.3s; outline: none;}
        .form-control:focus { border-color: var(--primary-color); background: var(--card-bg); box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);}
        .form-control:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .icon-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
        .icon-option { 
            width: 56px; height: 56px; border-radius: 14px; border: 2px solid transparent; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; background: var(--bg-color); transition: 0.2s; 
        }
        .icon-option:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); background: var(--card-bg); }
        .icon-option.selected { border-color: var(--primary-color); background: rgba(67, 97, 238, 0.1); box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2); }
        .icon-option img { width: 32px; height: 32px; object-fit: contain; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo"><i class="material-icons">account_balance_wallet</i> ExpensePro</div>
            <nav class="sidebar-menu">
                <a href="/screens/home.html" class="menu-item"><i class="material-icons">dashboard</i> Tổng quan</a>
                <a href="/screens/wallet.html" class="menu-item"><i class="material-icons">account_balance</i> Ví của tôi</a>
                <a href="/screens/stats.html" class="menu-item"><i class="material-icons">pie_chart</i> Thống kê</a>
            </nav>
            <div class="sidebar-footer">
                <a href="/screens/settings.html" class="menu-item active"><i class="material-icons">settings</i> Cài đặt</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div onclick="window.location.href='/screens/settings.html'" style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='var(--border-color)'; this.style.color='var(--text-main)'">
                        <i class="material-icons">arrow_back</i>
                    </div>
                    <h1 class="page-title">Quản lý Danh mục</h1>
                </div>
            </header>

            <div class="content-area" style="max-width: 800px;">
                <div class="card" style="padding: 32px; border-radius: 20px;" id="category-form-card">
                    <div class="flex-between" style="margin-bottom: 24px;">
                        <h2 id="form-heading" style="font-size: 18px; font-weight: 600; color: var(--text-main);">Thêm Danh Mục Mới</h2>
                        <button id="cancel-edit-btn" style="display: none; background: none; border: none; color: var(--danger-color); font-weight: 600; cursor: pointer; font-size: 14px;" onclick="cancelEdit()">HỦY SỬA</button>
                    </div>
                    
                    <div class="form-group">
                        <label>Tên danh mục</label>
                        <input type="text" id="cat-name" class="form-control" placeholder="VD: Mua sắm, Lương...">
                    </div>
                    
                    <div class="form-group">
                        <label>Loại giao dịch <span id="type-note" style="display: none; color: var(--warning-color); font-size: 11px; text-transform: none;">(Không thể đổi loại khi sửa)</span></label>
                        <select id="cat-type" class="form-control">
                            <option value="expense">Khoản Chi</option>
                            <option value="income">Khoản Thu</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Chọn biểu tượng</label>
                        <div class="icon-grid" id="icon-picker"></div>
                        <input type="hidden" id="cat-icon" value="other_expense"> 
                    </div>

                    <button id="submit-cat-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 16px; margin-top: 12px; font-size: 16px;" onclick="saveCategory()">
                        <i class="material-icons" id="submit-icon">add_circle</i> <span id="submit-text">THÊM DANH MỤC MỚI</span>
                    </button>
                </div>

                <h2 style="font-size: 20px; font-weight: 600; margin: 40px 0 16px; color: var(--text-main);">Danh sách của bạn</h2>
                <div id="category-list">
                    <p class="text-center" style="color: var(--text-muted);">Đang tải dữ liệu...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = '/index.html';
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        const availableIcons = [
            'baby', 'binoculars', 'borrowing', 'cancan', 'collecting', 
            'diet', 'eating', 'education', 'entertainment', 'gift',
            'health', 'in-love', 'invest_interest', 'lending', 'medicine', 
            'no-money', 'other_expense', 'other_income', 'package', 'piggy-bank',
            'repaying', 'salary', 'shopping', 'soft-drink', 'transport', 
            'user', 'utilities', 'wild-animals'
        ];

        let editingCategoryId = null; // Biến lưu trữ ID danh mục đang sửa

        function renderIconPicker() {
            const pickerDiv = document.getElementById('icon-picker');
            pickerDiv.innerHTML = availableIcons.map(iconName => `
                <div class="icon-option ${iconName === 'other_expense' ? 'selected' : ''}" 
                     data-icon="${iconName}" 
                     onclick="selectIcon('${iconName}')">
                    <img src="/assets/icons/${iconName}.png" onerror="this.src='/assets/icons/other_expense.png'">
                </div>
            `).join('');
        }

        function selectIcon(iconName) {
            document.getElementById('cat-icon').value = iconName;
            document.querySelectorAll('.icon-option').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.icon-option[data-icon="${iconName}"]`).classList.add('selected');
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories', { headers: { 'Authorization': `Bearer ${token}` }});
                const data = await res.json();
                
                const listDiv = document.getElementById('category-list');
                if(data.length === 0) {
                    listDiv.innerHTML = '<p class="text-center" style="color: var(--text-muted);">Chưa có danh mục nào</p>';
                    return;
                }

                listDiv.innerHTML = data.map(c => `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; margin-bottom: 12px; border-radius: 16px;">
                        <div style="display: flex; align-items: center;">
                            <div style="width: 52px; height: 52px; background: var(--bg-color); border-radius: 14px; display: flex; justify-content: center; align-items: center; margin-right: 16px;">
                                <img src="/assets/icons/${c.icon}.png" width="30" height="30" onerror="this.style.display='none'">
                            </div>
                            <div>
                                <b style="font-size: 16px; color: var(--text-main);">${c.name}</b> <br>
                                <span style="font-size: 13px; color: var(--text-muted); font-weight: 500;">${c.type === 'expense' ? 'Khoản Chi' : 'Khoản Thu'}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <i class="material-icons" style="color: var(--primary-color); cursor: pointer; padding: 10px; background: rgba(67, 97, 238, 0.1); border-radius: 12px; transition: 0.2s;" onmouseover="this.style.background='var(--primary-color)'; this.style.color='white'" onmouseout="this.style.background='rgba(67, 97, 238, 0.1)'; this.style.color='var(--primary-color)'" onclick="startEdit('${c.id}', '${c.name}', '${c.icon}', '${c.type}')">edit</i>
                            <i class="material-icons" style="color: var(--danger-color); cursor: pointer; padding: 10px; background: rgba(239, 68, 68, 0.1); border-radius: 12px; transition: 0.2s;" onmouseover="this.style.background='var(--danger-color)'; this.style.color='white'" onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'; this.style.color='var(--danger-color)'" onclick="deleteCat('${c.id}')">delete</i>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error("Lỗi tải danh mục:", err); }
        }
        
        // Bắt đầu quá trình sửa danh mục
        function startEdit(id, name, icon, type) {
            editingCategoryId = id;
            document.getElementById('cat-name').value = name;
            document.getElementById('cat-type').value = type;
            document.getElementById('cat-type').disabled = true; // Khóa loại danh mục
            document.getElementById('type-note').style.display = 'inline';
            selectIcon(icon);

            // Đổi giao diện form
            document.getElementById('form-heading').textContent = "Sửa Danh Mục";
            document.getElementById('cancel-edit-btn').style.display = 'block';
            
            const submitBtn = document.getElementById('submit-cat-btn');
            submitBtn.style.background = 'var(--warning-color)';
            document.getElementById('submit-icon').textContent = 'save';
            document.getElementById('submit-text').textContent = 'CẬP NHẬT LẠI';

            // Cuộn mượt lên form
            document.querySelector('.main-content').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Hủy sửa
        function cancelEdit() {
            editingCategoryId = null;
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-type').disabled = false;
            document.getElementById('type-note').style.display = 'none';
            selectIcon('other_expense');

            document.getElementById('form-heading').textContent = "Thêm Danh Mục Mới";
            document.getElementById('cancel-edit-btn').style.display = 'none';
            
            const submitBtn = document.getElementById('submit-cat-btn');
            submitBtn.style.background = 'var(--primary-color)';
            document.getElementById('submit-icon').textContent = 'add_circle';
            document.getElementById('submit-text').textContent = 'THÊM DANH MỤC MỚI';
        }

        // Gộp chung hàm Thêm và Cập nhật
        async function saveCategory() {
            const name = document.getElementById('cat-name').value;
            const type = document.getElementById('cat-type').value;
            const icon = document.getElementById('cat-icon').value;
            if(!name.trim()) return alert("Vui lòng nhập tên danh mục!");
            
            try {
                if (editingCategoryId) {
                    // CẬP NHẬT (PUT)
                    await fetch(`/api/categories/${editingCategoryId}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim(), icon: icon }) // Loại bỏ type vì Backend không cho sửa
                    });
                    cancelEdit(); // Reset form về trạng thái ban đầu
                } else {
                    // THÊM MỚI (POST)
                    await fetch('/api/categories', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim(), type: type, icon: icon })
                    });
                    document.getElementById('cat-name').value = '';
                }
                loadCategories();
            } catch (err) {
                alert("Lỗi kết nối đến máy chủ!");
            }
        }
        
        async function deleteCat(id) {
            if(confirm('Bạn có chắc chắn muốn xóa danh mục này?')) {
                await fetch(`/api/categories/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }});
                // Nếu đang sửa danh mục vừa xóa, hủy sửa luôn
                if (editingCategoryId === id) cancelEdit();
                loadCategories();
            }
        }

        renderIconPicker();
        loadCategories();
    </script>
</body>
</html>
