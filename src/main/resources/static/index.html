<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLCT_HK Quản Lý Chi Tiêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: #1f2937; overflow: hidden;
        }
        
        /* Hiệu ứng kính */
        .auth-wrapper {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 420px;
            padding: 40px 32px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.5);
            margin: 16px; 
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .auth-wrapper::-webkit-scrollbar { width: 4px; }
        .auth-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .logo-container { text-align: center; margin-bottom: 8px; color: #4361ee; }
        .logo-container .material-icons { font-size: 56px; background: linear-gradient(135deg, #4361ee, #f72585); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-wrapper h2 { text-align: center; margin-bottom: 32px; font-weight: 700; font-size: 24px; color: #111827;}
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #4b5563; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb;
            border-radius: 12px; font-size: 15px; outline: none; transition: all 0.3s; background: #ffffff;
        }
        .input-group input:focus { border-color: #4361ee; box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1); }
        
        button {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #4361ee, #3a0ca3); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3); margin-top: 10px;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(67, 97, 238, 0.4);}
        
        .toggle-text { text-align: center; margin-top: 24px; font-size: 14px; color: #6b7280; }
        .toggle-text a { color: #4361ee; text-decoration: none; font-weight: 600; transition: 0.3s; padding: 4px 8px; border-radius: 6px;}
        .toggle-text a:hover { background: rgba(67, 97, 238, 0.1); }
        
        #error-message { 
            color: #ef4444; text-align: center; font-size: 13px; font-weight: 500; 
            min-height: 20px; margin-bottom: 16px; background: rgba(239, 68, 68, 0.1); border-radius: 8px; padding: 8px; display: none;
        }
        #error-message:not(:empty) { display: block; }

        /* --- CSS cho nút Hiện/Ẩn mật khẩu --- */
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 38px;
            color: #9ca3af;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }
        .toggle-password:hover { color: #4361ee; }
        #password, #confirmPassword { padding-right: 48px !important; }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="logo-container">
            <i class="material-icons">account_balance_wallet</i>
        </div>
        <h2 id="form-title">Đăng Nhập</h2>
        
        <form id="auth-form">
            <div id="register-fields" style="display: none;">
                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" id="fullName" placeholder="VD: Nguyễn Văn A">
                </div>
                <div class="input-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="phone" placeholder="VD: 0987654321">
                </div>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="example@gmail.com">
            </div>
            
            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" required placeholder="••••••••">
                <span class="material-icons toggle-password" onclick="togglePassword('password', this)">visibility_off</span>
            </div>

            <div class="input-group" id="confirm-password-group" style="display: none;">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
                <span class="material-icons toggle-password" onclick="togglePassword('confirmPassword', this)">visibility_off</span>
            </div>

            <p id="error-message"></p>

            <button type="submit" id="submit-btn"><i class="material-icons" style="font-size: 20px;">login</i> Đăng Nhập</button>
        </form>

        <p class="toggle-text">
            <span id="toggle-msg">Chưa có tài khoản?</span> 
            <a href="#" id="toggle-link">Đăng ký ngay</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
