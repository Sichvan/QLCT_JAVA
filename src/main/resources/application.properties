# Render sẽ tự cấp cổng PORT, nếu không có thì mặc định là 5000
server.port=${PORT:5000}

# Kết nối đến MongoDB Atlas (Sử dụng biến MONGO_URI)
spring.data.mongodb.uri=${MONGO_URI}

# Cấu hình JWT (Giấu secret key đi)
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

# ==========================================
# CẤU HÌNH GỬI MAIL QUA BREVO (CỔNG 2525)
# ==========================================
# ====================== SMTP GMAIL (CÁCH DÙNG TỐT NHẤT TRÊN CLOUD) ======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}

# Bắt buộc dùng STARTTLS (port 587)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Thêm timeout để không bị treo mãi (rất quan trọng)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Tùy chọn (nếu vẫn lỗi thì thử thêm)
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- Cấu hình Google Gemini AI ---
gemini.api.key=${GEMINI_KEY}