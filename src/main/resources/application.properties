# Render sẽ tự cấp cổng PORT, nếu không có thì mặc định là 5000
server.port=${PORT:5000}

# Kết nối đến MongoDB Atlas (Sử dụng biến MONGO_URI)
# Mặc định dùng MongoDB local nếu chưa set biến môi trường
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/expense_management}

# Cấu hình JWT (Giấu secret key đi)
jwt.secret=${JWT_SECRET:MyDevSecretKey123456789012345678901234567890}
jwt.expiration=2592000000

# ==========================================
# CẤU HÌNH API GỬI MAIL (RESEND)
# ==========================================
resend.api.key=${RESEND_API_KEY:default-dev-key}

# --- Cấu hình Google Gemini AI ---
gemini.api.key=${GEMINI_KEY:default-dev-key}